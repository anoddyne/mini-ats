spring.application.name=mini-ats
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/mini-ats
spring.datasource.username=admin
spring.datasource.password=admin

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public

logging.level.org.flywaydb=DEBUG
spring.flyway.out-of-order=false
spring.flyway.validate-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate

jwt.secret=PracticeSecretForJWTAuthentication
jwt.expiration=86400000

minio.url=http://localhost:9000
minio.access-key=admin123
minio.secret-key=admin123
minio.bucket-name-resume=resumes
minio.bucket-name-companies=companies